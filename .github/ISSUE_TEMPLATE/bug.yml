name: Calculation or runtime bug
description: Report a reproducible engine, MCP, or documentation problem using synthetic data.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include a real name, birth record, consultation history, credential, or private endpoint. Reduce the issue to synthetic input.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Calendar or Four Pillars
        - Myeongri interpretation rule
        - Zi Wei Dou Shu
        - Qimen, Daliuren, Tieban, or another bounded system
        - Korean naming
        - MCP or HTTP transport
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include the smallest synthetic input and command needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source or independent reference
      description: Add a stable source locator when disputing a traditional calculation.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This report contains no real person's identifying or consultation data.
          required: true
